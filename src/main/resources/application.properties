spring.application.name=Insurance-Quoter-Core
server.port=8081

# DataSource — insurance_core_db (PostgreSQL :5433)
# Credentials are injected via environment variables — never hardcode them here
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/insurance_core_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging — only our app at INFO; silence framework noise
logging.level.root=WARN
logging.level.com.sofka.insurancequoter=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.hibernate.orm.connections=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.orm.jpa=ERROR

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active:local}

# Tracing — OTLP to Jaeger (HTTP/Protobuf)
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.compression=gzip
# Disable OTLP metrics export — Jaeger does not support /v1/metrics; Prometheus is used instead
management.otlp.metrics.export.enabled=false

# Logging pattern with traceId/spanId
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
