spring.application.name=Insurance-Quoter-Core
server.port=8081

# DataSource — insurance_core_db (PostgreSQL :5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/insurance_core_db
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging — only our app at INFO; silence framework noise
logging.level.root=WARN
logging.level.com.sofka.insurancequoter=INFO
logging.level.org.flywaydb=INFO
